name: Verify and build Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://zyrsakqocyjvfgauwdiz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_bVxHkS1PiXaiDcxDb16C8A_NU54FpXz
      - run: npx cap sync android
      - name: Restore Android notification configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.MCUBE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" > android/app/google-services.json
          fi
      - name: Restore private APK signer
        env:
          KEY_BASE64: ${{ secrets.MCUBE_SIGNING_KEY }}
        run: |
          test -n "$KEY_BASE64"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/mcube-upload.p12"
          chmod 600 "$RUNNER_TEMP/mcube-upload.p12"
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Build signed private release
        working-directory: android
        env:
          MCUBE_SIGNING_PATH: ${{ runner.temp }}/mcube-upload.p12
          MCUBE_SIGNING_PASSWORD: ${{ secrets.MCUBE_SIGNING_PASSWORD }}
          MCUBE_SIGNING_ALIAS: ${{ secrets.MCUBE_SIGNING_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native first launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
            cd .. && bash scripts/verify-release-startup.sh
      - name: Collect startup test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-startup-test-results
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            artifacts/android/release-startup/
      - uses: actions/upload-artifact@v4
        with:
          name: Mcube-Exporters-Android
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
