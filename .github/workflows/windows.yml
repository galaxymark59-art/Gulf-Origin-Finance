name: Verify and build Windows installer
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://zyrsakqocyjvfgauwdiz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_bVxHkS1PiXaiDcxDb16C8A_NU54FpXz
      - run: node scripts/prepare-desktop.mjs
      - run: npx electron-builder --win nsis --publish never
      - name: Verify Windows first launch
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'artifacts/windows/win-unpacked/Mcube Exporters.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Windows startup check failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mcube-Exporters-Windows
          path: |
            artifacts/windows/*Setup.exe
            artifacts/windows/startup.png
          retention-days: 14
