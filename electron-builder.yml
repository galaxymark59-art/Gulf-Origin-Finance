appId: com.mcube.exporters.finance
productName: Mcube Exporters
directories:
  app: desktop
  output: artifacts/windows
files:
  - web/**/*
  - main.cjs
  - preload.cjs
  - package.json
  - '!node_modules/**/*'
asar: true
win:
  icon: desktop/icon.ico
  target:
    - nsis
  artifactName: Mcube-Exporters-${version}-Setup.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
